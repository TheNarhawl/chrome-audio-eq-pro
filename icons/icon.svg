<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Фон: строгий темный squircle без градиентов и теней -->
  <rect width="128" height="128" rx="28" ry="28" fill="#1e1e1e" />
  <rect x="2" y="2" width="124" height="124" rx="26" ry="26" fill="none" stroke="#333333" stroke-width="4" />

  <!-- 4 полосы эквалайзера (минималистичный flat-спектр с бустом на 3-й полосе) -->
  <!-- Полоса 1: Низкие частоты (бас) -->
  <rect x="20" y="52" width="16" height="54" rx="4" fill="#4a9eff" />
  
  <!-- Полоса 2: Средние частоты -->
  <rect x="44" y="34" width="16" height="72" rx="4" fill="#4a9eff" />
  
  <!-- Полоса 3: Пиковый буст (акцент громкости до 1000%) -->
  <rect x="68" y="18" width="16" height="88" rx="4" fill="#68b0ff" />
  
  <!-- Полоса 4: Высокие частоты -->
  <rect x="92" y="42" width="16" height="64" rx="4" fill="#4a9eff" />
</svg>